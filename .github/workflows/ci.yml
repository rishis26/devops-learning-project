name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Build backend Docker image
        run: docker build -t devops-backend ./backend

      - name: Build frontend Docker image
        run: docker build -t devops-frontend ./frontend

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker tag devops-backend ${{ secrets.DOCKERHUB_USERNAME }}/devops-backend:latest

      - name: Push backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-backend:latest

      - name: Tag frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker tag devops-frontend ${{ secrets.DOCKERHUB_USERNAME }}/devops-frontend:latest

      - name: Push frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-frontend:latest

      - name: Setup SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AZURE_VM_SSH_KEY }}" > ~/.ssh/azure_vm_key
          chmod 600 ~/.ssh/azure_vm_key
          ssh-keyscan -H ${{ secrets.AZURE_VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Azure VM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ssh -o StrictHostKeyChecking=yes \
            -i ~/.ssh/azure_vm_key \
            ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_HOST }} << 'EOF'

            docker pull rishis26/devops-backend:latest
            docker pull rishis26/devops-frontend:latest

            docker stop devops-backend || true
            docker rm devops-backend || true

            docker stop devops-frontend || true
            docker rm devops-frontend || true

            docker run -d \
              --name devops-backend \
              --restart unless-stopped \
              -p 8080:8080 \
              rishis26/devops-backend:latest

            docker run -d \
              --name devops-frontend \
              --restart unless-stopped \
              -p 3000:3000 \
              rishis26/devops-frontend:latest

          EOF
